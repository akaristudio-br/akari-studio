<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos | Akari Studio</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .catalogo { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .catalogo h1 { text-align: center; font-weight: 300; letter-spacing: 2px; }
    .catalogo .intro { text-align: center; opacity: .75; margin-bottom: 30px; }
    .catalogo h2 { margin-top: 50px; font-weight: 300; letter-spacing: 1px; border-bottom: 1px solid #e6dcd8; padding-bottom: 8px; }
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; margin-top: 24px; }
    .card { background: #fffaf7; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.06); display: flex; flex-direction: column; }
    .card img.capa { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
    .miniaturas { display: flex; gap: 6px; padding: 8px 14px 0; }
    .miniaturas img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; cursor: pointer; opacity: .65; border: 2px solid transparent; }
    .miniaturas img.ativa, .miniaturas img:hover { opacity: 1; border-color: #e8cfd0; }
    .card .info { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card .nome { font-size: 1.05rem; margin: 0; }
    .card .etiqueta { font-size: .75rem; opacity: .7; text-transform: uppercase; letter-spacing: 1px; }
    .card .preco { font-weight: 600; }
    .card .encomenda { font-size: .8rem; opacity: .7; }
    .card a.pedir { margin-top: auto; text-align: center; padding: 10px; border-radius: 8px; background: #e8cfd0; color: #4a3a3a; text-decoration: none; }
    .card a.pedir:hover { background: #dfbcbd; }
  /* Menu principal */
.site-header {
  background: #fffaf7;
  border-bottom: 1px solid #eadeda;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar {
  max-width: 1100px;
  min-height: 76px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.navbar-logo img {
  width: 92px;
  height: auto;
  display: block;
  border-radius: 4px;
}

.nav-menu {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 22px;
}

.nav-menu a {
  color: #4a3a3a;
  text-decoration: none;
  font-size: .92rem;
  transition: color .2s ease;
}

.nav-menu a:hover {
  color: #b78386;
}

.nav-menu .nav-whatsapp {
  background: #e8cfd0;
  padding: 10px 14px;
  border-radius: 8px;
}

.nav-menu .nav-whatsapp:hover {
  background: #dfbcbd;
  color: #4a3a3a;
}

.menu-toggle {
  display: none;
  border: 0;
  background: transparent;
  color: #4a3a3a;
  font-size: 1.8rem;
  cursor: pointer;
  padding: 4px 8px;
}

@media (max-width: 760px) {
  .navbar {
    min-height: 64px;
  }

  .menu-toggle {
    display: block;
  }

  .nav-menu {
    display: none;
    position: absolute;
    top: 64px;
    left: 0;
    right: 0;
    padding: 18px 20px 22px;
    background: #fffaf7;
    border-bottom: 1px solid #eadeda;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
  }

  .nav-menu.aberto {
    display: flex;
  }

  .nav-menu a {
    padding: 12px 8px;
  }

  .nav-menu .nav-whatsapp {
    text-align: center;
    margin-top: 6px;
  }
}
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Navegação principal">
      <a class="navbar-logo" href="index.html" aria-label="Akari Studio - início">
        <img src="assets/logo/Akari_Logo.jpg" alt="Akari Studio">
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="menu-principal">
        ☰
      </button>

      <div class="nav-menu" id="menu-principal">
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="index.html#sobre">Sobre a Akari</a>
        <a href="index.html#como-comprar">Como comprar</a>
        <a href="index.html#contato">Contato</a>
        <a
          class="nav-whatsapp"
          href="https://wa.me/551151941220"
          target="_blank"
          rel="noopener">
          WhatsApp
        </a>
      </div>
    </nav>
  </header>

  <main class="catalogo">
    <h1>Nossos Produtos</h1>
    <p class="intro">Coasters e bookmarks feitos sob encomenda, com cuidado em cada detalhe.</p>

    <h2>Coasters</h2>
    <div class="grade" id="grade-coasters"></div>

    <h2>Bookmarks</h2>
    <div class="grade" id="grade-bookmarks"></div>
  </main>

  <script>
    const WHATSAPP = "551151941220";
    const menuToggle = document.querySelector(".menu-toggle");
const menuPrincipal = document.querySelector("#menu-principal");

menuToggle.addEventListener("click", function () {
  const aberto = menuPrincipal.classList.toggle("aberto");

  menuToggle.setAttribute("aria-expanded", aberto ? "true" : "false");
  menuToggle.setAttribute(
    "aria-label",
    aberto ? "Fechar menu" : "Abrir menu"
  );
});

menuPrincipal.querySelectorAll("a").forEach(function (link) {
  link.addEventListener("click", function () {
    menuPrincipal.classList.remove("aberto");
    menuToggle.setAttribute("aria-expanded", "false");
    menuToggle.setAttribute("aria-label", "Abrir menu");
  });
});
    const PASTA = "assets/produtos/";

    const coasters = [
      { nome: "Autumn Japanese", preco: 49.392, imgs: ["coasters/autumn-japanese-coaster-mosaic.png"] },
      { nome: "Celestial", preco: 64.272, imgs: ["coasters/celestial1.jpg"] },
      { nome: "Coaster blossom scenery", preco: 63.312, imgs: ["coasters/coaster-blossom-scenery7.jpg"], etiqueta: "Set" },
      { nome: "Eve set #1", preco: 35.472, imgs: ["coasters/eve-set1.jpg", "coasters/eve-set2.jpg", "coasters/eve-set3.jpg"], etiqueta: "Set" },
      { nome: "Eve set #2", preco: 34.032, imgs: ["coasters/eve-set4.jpg", "coasters/eve-set5.jpg", "coasters/eve-set6.jpg"], etiqueta: "Set" },
      { nome: "Eve set #3", preco: 34.032, imgs: ["coasters/eve-set7.jpg", "coasters/eve-set8.jpg", "coasters/eve-set9.jpg"], etiqueta: "Set" },
      { nome: "Grande onda mosaico", preco: 67.104, imgs: ["coasters/grande-onda-mosaico.png"] },
      { nome: "Japanese set", preco: 62.832, imgs: ["coasters/japanese-coasters-set3.jpg"], etiqueta: "Set" },
      { nome: "Maré ao luar", preco: 29.376, imgs: ["coasters/mare-ao-luar1.jpg"] },
      { nome: "Pokemon mosaico", preco: 19.632, imgs: ["coasters/pokemon-mosaic1.png"] },
      { nome: "Totoro red tree", preco: 125.76, imgs: ["coasters/totoro-coaster-2.png"] }
    ];

    const bookmarks = [
      { nome: "Blood Moon", preco: 26.496, imgs: ["bookmarks/bloodmoon2.png"] },
      { nome: "Bonsai Verde", preco: 10.9, imgs: ["bookmarks/bonsai2e.jpg", "bookmarks/bonsai2j.jpg"] },
      { nome: "Bulbasauro", preco: 6, imgs: ["bookmarks/bulbasauro.jpg"] },
      { nome: "Cerejeiras ao luar", preco: 10.752, imgs: ["bookmarks/cerejeiras-ao-luar.jpg"] },
      { nome: "Charmander", preco: 5.52, imgs: ["bookmarks/charmander1.jpg"] },
      { nome: "Cherry blossom set", preco: 17.568, imgs: ["bookmarks/cherry-blossom-scenic-set6.jpg", "bookmarks/cherry-blossom-scenic-set10.jpg", "bookmarks/cherry-blossom-scenic-set1.jpg", "bookmarks/cherry-blossom-scenic-set3.jpg"], etiqueta: "Set" },
      { nome: "Cherry tide", preco: 14.976, imgs: ["bookmarks/cherrytide1.jpg"] },
      { nome: "Floresta fantasia set", preco: 20.64, imgs: ["bookmarks/florestafantasia2.jpg"], etiqueta: "Set" },
      { nome: "Hello Kitty set", preco: 21.168, imgs: ["bookmarks/hellokitty-set1.jpg"], etiqueta: "Set" },
      { nome: "Huntrix", preco: 8.544, imgs: ["bookmarks/huntrix2.jpg"] },
      { nome: "Itadori", preco: 7.776, imgs: ["bookmarks/itadori2.jpg"] },
      { nome: "Kuromi & Melody", preco: 24.864, imgs: ["bookmarks/kuromimelody.jpg"] },
      { nome: "Megumi", preco: 6.4848, imgs: ["bookmarks/megumi1.jpg"] },
      { nome: "Melodia e Donzela", preco: 10.464, imgs: ["bookmarks/melodia-e-donzela.jpg"] },
      { nome: "Nezuko (vazado)", preco: 5.808, imgs: ["bookmarks/nezuko-cutout6.jpg"] },
      { nome: "Nezuko", preco: 7.2, imgs: ["bookmarks/nezuko1.jpg"] },
      { nome: "Jujutsu Panda", preco: 7.8816, imgs: ["bookmarks/panda1.jpg"] },
      { nome: "Pikachu Batalha", preco: 8.88, imgs: ["bookmarks/pikachu-batalha.jpg"] },
      { nome: "Pikachu Lightning", preco: 6.4944, imgs: ["bookmarks/pikachu.jpg"] },
      { nome: "Ryomen Sukuna", preco: 9.168, imgs: ["bookmarks/ryomensukuna.jpg"] },
      { nome: "Saja Boys", preco: 8.976, imgs: ["bookmarks/saja-boys.jpg"] },
      { nome: "Sakura framed", preco: 8.64, imgs: ["bookmarks/sakura.jpg", "bookmarks/sakura-framed1.jpg"] },
      { nome: "Sakura set", preco: 31.008, imgs: ["bookmarks/sakuradarkset.jpg"], etiqueta: "Set" },
      { nome: "Satoru Gojo", preco: 8.64, imgs: ["bookmarks/satorugojo1.jpg"] },
      { nome: "Squirtle", preco: 6.0096, imgs: ["bookmarks/squirtle.jpg"] },
      { nome: "Tanjiro chamas", preco: 8.448, imgs: ["bookmarks/tanjiro2.jpg", "bookmarks/tanjiro3.jpg"] },
      { nome: "Totoro Gogh", preco: 8.16, imgs: ["bookmarks/totoro-gogh1.jpg"] },
      { nome: "Totoro rain leaf", preco: 6.432, imgs: ["bookmarks/totoro-rain-leaf-bookmark3.jpg", "bookmarks/totoro-rain-leaf-bookmark4.jpg"] },
      { nome: "Zenitsu", preco: 7.776, imgs: ["bookmarks/zenitsu1.jpg"] }
    ];

    function formatarPreco(valor) {
      return "R$ " + valor.toFixed(2).replace(".", ",");
    }

    function trocarFoto(miniatura, caminho) {
      const card = miniatura.closest(".card");
      card.querySelector(".capa").src = caminho;
      card.querySelectorAll(".miniaturas img").forEach(function (m) { m.classList.remove("ativa"); });
      miniatura.classList.add("ativa");
    }

    function criarCard(p) {
      const msg = encodeURIComponent("Olá! Tenho interesse no produto: " + p.nome);
      const etiqueta = p.etiqueta ? '<span class="etiqueta">' + p.etiqueta + '</span>' : "";
      let miniaturas = "";
      if (p.imgs.length > 1) {
        miniaturas = '<div class="miniaturas">' + p.imgs.map(function (img, i) {
          const caminho = PASTA + img;
          return '<img src="' + caminho + '" alt="' + p.nome + ' foto ' + (i + 1) + '"' +
            (i === 0 ? ' class="ativa"' : '') +
            ' onclick="trocarFoto(this, \'' + caminho + '\')">';
        }).join("") + '</div>';
      }
      return '<article class="card">' +
        '<img class="capa" src="' + PASTA + p.imgs[0] + '" alt="' + p.nome + '" loading="lazy">' +
        miniaturas +
        '<div class="info">' + etiqueta +
        '<h3 class="nome">' + p.nome + '</h3>' +
        '<span class="preco">' + formatarPreco(p.preco) + '</span>' +
        '<span class="encomenda">Feito sob encomenda</span>' +
        '<a class="pedir" href="https://wa.me/' + WHATSAPP + '?text=' + msg + '" target="_blank" rel="noopener">Pedir pelo WhatsApp</a>' +
        '</div></article>';
    }

    document.getElementById("grade-coasters").innerHTML = coasters.map(criarCard).join("");
    document.getElementById("grade-bookmarks").innerHTML = bookmarks.map(criarCard).join("");
  </script>
</body>
</html>
